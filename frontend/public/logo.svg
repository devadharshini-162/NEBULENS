<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="nebula-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Fire / Flare Gradient -->
    <linearGradient id="fire-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="85%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Lens Rim Gradient -->
    <linearGradient id="lens-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Satellite Orbit Glow -->
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9" />
    </linearGradient>

    <!-- Inner Core Glow -->
    <radialGradient id="lens-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Circular Outer Shield -->
  <rect width="100" height="100" rx="24" fill="url(#nebula-bg)" />
  <rect width="100" height="100" rx="24" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Calibrated Grid Lines (Observation Reticle) -->
  <circle cx="50" cy="50" r="38" fill="url(#lens-glow)" stroke="url(#lens-rim)" stroke-width="1.8" />
  <circle cx="50" cy="50" r="28" fill="none" stroke="#475569" stroke-width="0.8" stroke-dasharray="2,3" />

  <!-- Crosshairs -->
  <line x1="50" y1="8" x2="50" y2="18" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="50" y1="82" x2="50" y2="92" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="8" y1="50" x2="18" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="82" y1="50" x2="92" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Elliptical Satellite Orbit -->
  <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="url(#orbit-grad)" stroke-width="1.2" transform="rotate(-28 50 50)" stroke-dasharray="64 6" />

  <!-- Orbiting Sensor Node (Terra/VIIRS) -->
  <circle cx="80" cy="34" r="2.8" fill="#38bdf8" />
  <circle cx="80" cy="34" r="5" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.6" />

  <!-- Center Active Fire Flame -->
  <path d="M 50 25 
           C 53 35, 62 42, 62 53 
           C 62 65, 54 71, 50 71 
           C 46 71, 38 65, 38 53 
           C 38 41, 48 34, 50 25 Z" 
        fill="url(#fire-grad)" />

  <!-- Inner Hot Flame Core -->
  <path d="M 50 42 
           C 52 47, 56 51, 56 57 
           C 56 63, 52 66, 50 66 
           C 48 66, 44 63, 44 57 
           C 44 51, 49 47, 50 42 Z" 
        fill="#ffffff" opacity="0.95" />
</svg>
